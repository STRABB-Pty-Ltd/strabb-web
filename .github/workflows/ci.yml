name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run tests
        run: npm run test

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  build:
    name: Build Check
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: ci-test-secret
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Staging
    needs: [lint, test, typecheck, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # Tag every push with the commit SHA in addition to the rolling
      # `:staging` tag. `az containerapp update` only creates a new revision
      # when the image reference changes, so deploying `:staging` repeatedly
      # silently keeps the old digest. Using `:${{ github.sha }}` forces a
      # new revision on every push.
      # INTERNAL_API_URL must be passed as a build-arg, NOT a runtime env
      # var. Next.js evaluates `next.config.ts` during `next build` for
      # standalone output, so the rewrite destination is baked into the
      # image. Setting it only on the Container App at runtime falls back
      # to `http://localhost:8000` and every `/be/*` call fails with
      # ECONNREFUSED.
      - name: Build and push web image
        run: az acr build --registry strabbregistry --resource-group strabb-staging --image strabb-web:staging --image strabb-web:${{ github.sha }} --build-arg NEXTAUTH_URL=https://staging.strabb.io --build-arg NEXT_PUBLIC_API_URL=https://api.staging.strabb.io --build-arg INTERNAL_API_URL=https://strabb-api-staging.icywave-6a962c16.australiaeast.azurecontainerapps.io --build-arg NEXT_PUBLIC_APPLICATIONINSIGHTS_CONNECTION_STRING="${{ secrets.APPINSIGHTS_WEB_CONNECTION_STRING_STAGING }}" .
      - name: Deploy to Container App
        run: az containerapp update --name strabb-web-staging --resource-group strabb-staging --image strabbregistry.azurecr.io/strabb-web:${{ github.sha }}
