name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run tests
        run: npm run test

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  build:
    name: Build Check
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: ci-test-secret
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Staging
    needs: [lint, test, typecheck, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # Tag every push with the commit SHA in addition to the rolling
      # `:staging` tag. `az containerapp update` only creates a new revision
      # when the image reference changes, so deploying `:staging` repeatedly
      # silently keeps the old digest. Using `:${{ github.sha }}` forces a
      # new revision on every push.
      # INTERNAL_API_URL must be passed as a build-arg, NOT a runtime env
      # var. Next.js evaluates `next.config.ts` during `next build` for
      # standalone output, so the rewrite destination is baked into the
      # image. Setting it only on the Container App at runtime falls back
      # to `http://localhost:8000` and every `/be/*` call fails with
      # ECONNREFUSED.
      - name: Build and push web image
        run: az acr build --registry strabbregistry --resource-group strabb-staging --image strabb-web:staging --image strabb-web:${{ github.sha }} --build-arg NEXTAUTH_URL=https://staging.strabb.io --build-arg NEXT_PUBLIC_API_URL=https://api.staging.strabb.io --build-arg INTERNAL_API_URL=https://strabb-api-staging.icywave-6a962c16.australiaeast.azurecontainerapps.io .
      - name: Deploy to Container App
        run: az containerapp update --name strabb-web-staging --resource-group strabb-staging --image strabbregistry.azurecr.io/strabb-web:${{ github.sha }}

  # Runs alongside the Azure deploy during the staging cutover to the iMeg
  # Coolify (02-07-2026). Coolify pulls main and builds on the iMeg itself
  # (NEXT_PUBLIC_API_URL etc. are set as build-time vars on the Coolify
  # app, mirroring the --build-arg list above), so this job only queues the
  # deployment. The runner joins the tailnet because the Coolify API is
  # Tailscale-only. Remove the Azure `deploy` job (or gate it) once DNS
  # points staging at the tunnel and Chris signs off.
  deploy-coolify-staging:
    name: Deploy to Coolify Staging (iMeg)
    needs: [lint, test, typecheck, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: 1.98.4
      - name: Trigger Coolify deploy (web)
        run: |
          resp=$(curl -sf -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "http://100.117.139.108:8000/api/v1/deploy?uuid=y9gkr1m6xby8zvuvi4nompl2&force=false")
          echo "$resp"
          echo "$resp" | jq -e '.deployments | length == 1' >/dev/null \
            || { echo "Coolify did not queue the web deployment"; exit 1; }
